name: Release Pipeline

#==================================================================================================
# Trigger Conditions
#==================================================================================================

# The Nanvix toolchain now ships its C library and headers in-source (fetched
# from the nanvix/nanvix release by the `z` build script). There is therefore no
# longer a binutils/newlib cross-repository dispatch chain: the full toolchain
# (stage 0 compiler + stage 1 runtimes/libc) is built and published directly
# whenever the release branch is updated.
on:
  workflow_dispatch:
  # Build and publish as soon as a release branch is updated (e.g. when a PR is
  # merged), matching the intent described above. Without this, merges triggered
  # no CI at all: nanvix-build.yml is pull_request-only and defers merges here,
  # but this workflow previously ran only on the nightly schedule. The
  # `check_release` step keys the tag/release off the current commit SHA and
  # skips the build+publish when that release already exists, so this does not
  # double-publish with the nightly run below.
  push:
    branches:
      - 'dev'
      - 'nanvix/**'
  # Nightly release run (06:00 UTC). The `check_release` step below keys the
  # tag/release off the current commit SHA and skips the build+publish when that
  # release already exists, so a scheduled run only publishes a new toolchain
  # when HEAD has advanced since the last release.
  schedule:
    - cron: "0 6 * * *"

concurrency:
  group: release-llvm-${{ github.ref }}
  cancel-in-progress: false

#==================================================================================================
# Environment Variables
#==================================================================================================

env:
  # Version of LLVM.
  LLVM_VERSION: "22.1.8"
  # Directory where LLVM (and the staged in-source sysroot) will be installed.
  INSTALL_LOCATION: /opt/nanvix
  # Token used by `z` to download the in-source Nanvix libc release (nanvix/nanvix
  # is public, so the default GITHUB_TOKEN is sufficient) and by `gh` calls below.
  GH_TOKEN: ${{ github.token }}

#==================================================================================================
# Jobs
#==================================================================================================

jobs:
  release:
    runs-on: ubuntu-24.04

    permissions:
      contents: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup Git configuration
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"

    - name: Get commit information
      id: commit_info
      run: |
        SHORT_SHA=$(git rev-parse --short HEAD)
        TAG_NAME="nanvix-v${{ env.LLVM_VERSION }}-${SHORT_SHA}"
        RELEASE_NAME="nanvix-llvm-${{ env.LLVM_VERSION }}-${SHORT_SHA}"
        echo "short_sha=${SHORT_SHA}" >> $GITHUB_OUTPUT
        echo "tag_name=${TAG_NAME}" >> $GITHUB_OUTPUT
        echo "release_name=${RELEASE_NAME}" >> $GITHUB_OUTPUT

    - name: Check if release already exists
      id: check_release
      run: |
        TAG_NAME="${{ steps.commit_info.outputs.tag_name }}"
        if gh release view "${TAG_NAME}" --repo "${{ github.repository }}" >/dev/null 2>&1; then
          echo "exists=true" >> $GITHUB_OUTPUT
          echo "Release ${TAG_NAME} already exists; skipping build and publish."
        else
          echo "exists=false" >> $GITHUB_OUTPUT
        fi

    #----------------------------------------------------------------------------------------------
    # Build (stage 0 compiler -> stage 1 runtimes + in-source Nanvix libc)
    #----------------------------------------------------------------------------------------------

    # Build stage 0 + stage 1, install into INSTALL_LOCATION, and run the
    # build-only smoke tests. The shared build/test sequence lives in the
    # nanvix-build composite action (also used by the PR CI pipeline,
    # nanvix-build.yml) and runs in this job, so the installed toolchain remains
    # available to the release/packaging steps below.
    - name: Build and test toolchain
      if: steps.check_release.outputs.exists == 'false'
      uses: ./.github/actions/nanvix-build
      with:
        install-location: ${{ env.INSTALL_LOCATION }}
        release-name: ${{ steps.commit_info.outputs.release_name }}
        cache-key: ${{ runner.os }}-sccache-release-${{ github.sha }}
        cache-restore-keys: |
          ${{ runner.os }}-sccache-release-
          ${{ runner.os }}-sccache

    #----------------------------------------------------------------------------------------------
    # Release Artifact (tarball)
    #----------------------------------------------------------------------------------------------

    # `./z release` builds the toolchain and creates the release tarball.
    - name: Create release artifacts
      if: steps.check_release.outputs.exists == 'false'
      run: ./z release

    #----------------------------------------------------------------------------------------------
    # Git Tag + GitHub Release
    #----------------------------------------------------------------------------------------------

    - name: Create release tag
      if: steps.check_release.outputs.exists == 'false'
      run: |
        TAG_NAME="${{ steps.commit_info.outputs.tag_name }}"
        if git rev-parse -q --verify "refs/tags/${TAG_NAME}" >/dev/null; then
          echo "Tag ${TAG_NAME} already exists locally; skipping tag creation."
        else
          git tag "${TAG_NAME}"
          git push origin "${TAG_NAME}"
        fi

    - name: Create GitHub Release
      if: steps.check_release.outputs.exists == 'false'
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ steps.commit_info.outputs.tag_name }}
        name: "${{ steps.commit_info.outputs.tag_name }}"
        body: |
          Automated release of the Nanvix LLVM ${{ env.LLVM_VERSION }} toolchain.

          Built from commit: ${{ steps.commit_info.outputs.short_sha }}

          This toolchain targets the Nanvix operating system (i686-unknown-nanvix)
          and bundles the in-source Nanvix C library and headers.

          **Artifacts:**
          - Tarball: `${{ steps.commit_info.outputs.release_name }}.tar.bz2`
        files: |
          .nanvix/out/${{ steps.commit_info.outputs.release_name }}.tar.bz2
        draft: false
        prerelease: false
